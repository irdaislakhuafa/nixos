decoration {
    # Apple Dark Glassmorphism Hyprland Decoration Theme
    # Smoked dark glass aesthetic with rich contrast and deep shadows

    rounding = 14
    dim_inactive = true
    dim_strength = 0.18
    active_opacity = 0.82
    inactive_opacity = 0.68

    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
        popups_ignorealpha = 0.6
        vibrancy = 0.20
        vibrancy_darkness = 0.50
        contrast = 1.25
        brightness = 0.68
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 45
        render_power = 4
        ignore_window = true
        color = rgba(00000099)
        color_inactive = rgba(00000066)
        offset = 0, 8
    }
}

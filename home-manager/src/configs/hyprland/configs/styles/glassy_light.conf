decoration {
    # Apple Light Glassmorphism Hyprland Decoration Theme
    # Bright, crystal glass aesthetic with soft translucent shadows

    rounding = 14
    dim_inactive = true
    dim_strength = 0.10
    active_opacity = 0.88
    inactive_opacity = 0.75

    blur {
        enabled = true
        size = 14
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
        popups_ignorealpha = 0.6
        vibrancy = 0.40
        vibrancy_darkness = 0.10
        contrast = 1.05
        brightness = 1.15
        noise = 0.01
    }

    shadow {
        enabled = true
        range = 35
        render_power = 4
        ignore_window = true
        color = rgba(00000033)
        color_inactive = rgba(0000001a)
        offset = 0, 6
    }
}

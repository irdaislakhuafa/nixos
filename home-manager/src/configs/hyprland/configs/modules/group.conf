group {
	focus_removed_window = true
	insert_after_current = true

	col.border_active = rgba(ffffff35) rgba(ffffff10) 45deg
	col.border_inactive = rgba(10121880)
	col.border_locked_active = rgba(f59e0bcc) rgba(fbbf24aa) 45deg
	col.border_locked_inactive = rgba(10121880)

	groupbar {
		enabled = true
		height = 10
		font_size = 7
		font_family = Inter, SF Pro Display, JetBrains Mono, sans-serif
		stacked = false
		render_titles = true
		scrolling = true

		# Glassy Night Minimal smoked glass palette
		col.active = rgba(ffffff38)
		col.inactive = rgba(1012188c)
		col.locked_active = rgba(f59e0bcc)
		col.locked_inactive = rgba(1012188c)

		# Groupbar text color
		text_color = rgba(ffffffff)
	}
}

# see https://wiki.hyprland.org/Configuring/Binds/ for more
# move active window out from group
bind = $mod CONTROL, RETURN, exec, hyprctl dispatch "moveoutofgroup"

binde = $mod CONTROL, right, changegroupactive, f
binde = $mod CONTROL, left, changegroupactive, b



# macOS-style animations: quick scale+fade, smooth ease-out deceleration,
# no bounce. Speed unit ≈ 100ms (Hyprland deciseconds).
animations {
    enabled = yes

    # Apple's standard easing (same as CSS `ease`) — general motion
    bezier = macEase, 0.25, 0.1, 0.25, 1.0
    # Fast start, long smooth deceleration — opening windows/panels
    bezier = macOut, 0.16, 1.0, 0.3, 1.0
    # Gentle acceleration — closing windows / fading out
    bezier = macIn, 0.4, 0.0, 1.0, 1.0

    # Windows: subtle scale (90% → 100%) + fade in, ~300ms
    animation = windowsIn, 1, 3, macOut, popin 90%
    # Windows close: pure fade, ~200ms (popin 100% = no shrink, fade does the work)
    animation = windowsOut, 1, 2, macIn, popin 100%
    # Dragging/resizing: smooth ease, ~300ms
    animation = windowsMove, 1, 3, macEase

    # Fades
    animation = fadeIn, 1, 3, macOut
    animation = fadeOut, 1, 2, macIn
    animation = fadeSwitch, 1, 2, macEase
    animation = fadeShadow, 1, 3, macEase

    # Layers (waybar, launchers, popups): quick fade, ~250ms
    animation = layersIn, 1, 3, macOut, fade
    animation = layersOut, 1, 2, macIn, fade

    # Workspaces: keep previous default transition
    animation = workspaces, 1, 6, default

    # Border color switch stays subtle
    animation = border, 1, 5, macEase
}

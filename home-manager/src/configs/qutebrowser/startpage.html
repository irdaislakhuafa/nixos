<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start</title>
  <style>
    :root {
      --bg1: #000000;
      --bg2: #000000;
      --bg3: #000000;
      --orb1: #0a5fd0;
      --orb2: #00b8e6;
      --orb3: #2a3cff;
      --text: #eaf4ff;
      --muted: #8aa6c4;
      --glass: rgba(120, 170, 255, .16);
      --glass-edge: rgba(170, 210, 255, .38);
      --glass-shadow: rgba(0, 10, 40, .55);
      --neon: #27d3ff;
      --glow: rgba(39, 211, 255, .65);
      --body: #1fb6ff;
      --body-dark: #0a6fd0;
      --s: 1.3;
    }

    :root[data-theme="light"] {
      --bg1: #eaf4ff;
      --bg2: #c4dbff;
      --bg3: #8fb8ff;
      --orb1: #4d8dff;
      --orb2: #5fdcff;
      --orb3: #8a8cff;
      --text: #0b1f4d;
      --muted: #4a6499;
      --glass: rgba(255, 255, 255, .34);
      --glass-edge: rgba(255, 255, 255, .85);
      --glass-shadow: rgba(20, 60, 140, .25);
      --neon: #0a8fe0;
      --glow: rgba(10, 143, 224, .45);
      --body: #18a6f5;
      --body-dark: #0b63c4;
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Inter", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      overflow: hidden;
      display: grid;
      place-items: center;
      transition: background .5s, color .5s;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .55;
      pointer-events: none
    }

    [data-theme="dark"] .orb {
      opacity: .26 !important
    }

    .o1 {
      width: 44vmax;
      height: 44vmax;
      background: var(--orb1);
      left: -12vmax;
      top: -14vmax
    }

    .o2 {
      width: 36vmax;
      height: 36vmax;
      background: var(--orb2);
      right: -10vmax;
      bottom: -12vmax;
      opacity: .4
    }

    .o3 {
      width: 28vmax;
      height: 28vmax;
      background: var(--orb3);
      right: 18vmax;
      top: -8vmax;
      opacity: .35
    }

    main {
      position: relative;
      width: min(680px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0
    }

    .stage {
      position: relative;
      width: 100%;
      height: calc(260px*var(--s))
    }

    .gopher {
      position: absolute;
      left: 50%;
      top: 0;
      width: calc(200px*var(--s));
      height: calc(260px*var(--s));
      margin-left: calc(-100px*var(--s));
      z-index: 1;
      filter: drop-shadow(0 0 20px var(--glow));
      transform-origin: 50% 95%
    }

    .glass {
      will-change: transform
    }

    body {
      user-select: none;
      -webkit-user-select: none
    }

    #q {
      user-select: text;
      -webkit-user-select: text
    }

    .glass {
      cursor: grab;
      touch-action: none
    }

    .links a {
      -webkit-user-drag: none
    }

    .gopher {
      pointer-events: none
    }

    .gopher * {
      pointer-events: auto;
      cursor: grab
    }

    .pupil {
      transition: transform .06s linear
    }

    .lid {
      transform-box: fill-box;
      transform-origin: 50% 0;
      transform: scaleY(0);
      transition: transform .08s
    }

    .blink .lid {
      transform: scaleY(1)
    }

    .blush {
      opacity: 0;
      transition: opacity .3s
    }

    .typing .blush {
      opacity: .7
    }

    .glass {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, .16), var(--glass) 40%, rgba(255, 255, 255, .04));
      -webkit-backdrop-filter: blur(22px) saturate(1.8);
      backdrop-filter: blur(22px) saturate(1.8);
      border: 1px solid var(--glass-edge);
      box-shadow: 0 18px 50px var(--glass-shadow),
        inset 0 1.5px 1px rgba(255, 255, 255, .45),
        inset 0 -10px 24px rgba(80, 150, 255, .12);
    }

    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(120% 90% at 15% 0%, rgba(255, 255, 255, .28), transparent 45%)
    }

    form {
      width: 100%;
      position: absolute;
      left: 0;
      top: calc(165px*var(--s) - 31px);
      z-index: 2;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 24px;
      transition: box-shadow .3s
    }

    form:focus-within {
      box-shadow: 0 18px 50px var(--glass-shadow), 0 0 0 1.5px var(--neon), 0 0 34px var(--glow), inset 0 1.5px 1px rgba(255, 255, 255, .45)
    }

    svg.mag {
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--muted)
    }

    #q {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: var(--text);
      font: 500 18px/1.2 inherit;
      font-family: inherit;
      padding: 14px 0;
      caret-color: var(--neon)
    }

    #q::placeholder {
      color: var(--muted);
      font-weight: 400
    }

    .go {
      flex: none;
      border: 0;
      cursor: pointer;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, var(--neon), var(--body-dark));
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px var(--glow), inset 0 1px 1px rgba(255, 255, 255, .6);
      transition: transform .2s
    }

    .go:hover {
      transform: scale(1.08)
    }

    .go svg {
      width: 20px;
      height: 20px
    }

    .links {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      position: relative;
      z-index: 1
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 20px;
      border-radius: 999px;
      transition: box-shadow .2s
    }

    .links a:hover,
    .links a:focus-visible {
      outline: 0;
      box-shadow: 0 10px 28px var(--glass-shadow), 0 0 0 1.5px var(--neon), 0 0 20px var(--glow)
    }

    .clock {
      position: fixed;
      top: 22px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: max-content;
      max-width: 90vw;
      text-align: center;
      padding: 18px 64px 20px;
      border-radius: 44px;
      font-size: 18px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      cursor: default;
      user-select: none
    }

    .clock b,
    .clock span {
      position: relative
    }

    .clock b {
      display: block;
      font-size: 68px;
      line-height: 1.05;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.03em
    }

    .theme {
      position: fixed;
      top: 22px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--glass-edge);
      cursor: pointer;
      color: var(--text);
      display: grid;
      place-items: center
    }

    .theme svg {
      width: 22px;
      height: 22px
    }

    .theme .sun {
      display: none
    }

    [data-theme="light"] .theme .sun {
      display: block
    }

    [data-theme="light"] .theme .moon {
      display: none
    }

    .theme:focus-visible,
    .go:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 2px
    }

    #q:focus,
    #q:focus-visible {
      outline: none;
      box-shadow: none;
      border-radius: 999px;
      -webkit-appearance: none;
      appearance: none
    }

    form {
      overflow: hidden;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent
    }


    /* ---- liquid glass: dark, then light ---- */
    [data-theme="dark"] .glass {
      background: linear-gradient(135deg, rgba(0, 0, 0, .55), rgba(6, 16, 38, .38) 50%, rgba(0, 0, 0, .55));
      backdrop-filter: blur(14px) saturate(2) brightness(1.1);
      backdrop-filter: blur(8px) saturate(2.2) brightness(1.12) url(#liquid);
      border: 1px solid rgba(120, 180, 255, .20);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .7),
        inset 1px 1px 3px rgba(150, 200, 255, .22),
        inset -3px -4px 10px rgba(0, 0, 0, .55),
        inset 0 0 22px rgba(20, 90, 200, .14);
    }

    [data-theme="dark"] .glass::before {
      background: radial-gradient(circle 120px at var(--mx, 18%) var(--my, 0%), rgba(40, 130, 255, .16), transparent 70%),
        linear-gradient(180deg, rgba(0, 0, 0, .35), transparent 45%)
    }

    [data-theme="dark"] form:focus-within {
      box-shadow: 0 20px 50px rgba(0, 8, 40, .6), 0 0 0 1.5px var(--neon), 0 0 40px var(--glow), inset 2px 2px 6px rgba(190, 235, 255, .38), inset -3px -4px 10px rgba(30, 120, 255, .3)
    }

    [data-theme="dark"] .links a:hover,
    [data-theme="dark"] .links a:focus-visible {
      box-shadow: 0 12px 30px rgba(0, 8, 40, .6), 0 0 0 1.5px var(--neon), 0 0 26px var(--glow), inset 2px 2px 6px rgba(190, 235, 255, .45), inset -3px -4px 10px rgba(30, 120, 255, .3)
    }

    [data-theme="light"] .glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .22) 45%, rgba(190, 225, 255, .32));
      backdrop-filter: blur(14px) saturate(1.8);
      backdrop-filter: blur(8px) saturate(1.9) url(#liquid);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 18px 44px rgba(30, 80, 170, .28),
        inset 2px 2px 6px rgba(255, 255, 255, .95),
        inset -3px -4px 10px rgba(60, 130, 240, .22),
        inset 0 0 22px rgba(255, 255, 255, .35);
    }

    [data-theme="light"] .glass::before {
      background: radial-gradient(circle 120px at var(--mx, 18%) var(--my, 0%), rgba(255, 255, 255, .85), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, .5), transparent 38%)
    }

    [data-theme="light"] form:focus-within {
      box-shadow: 0 18px 44px rgba(30, 80, 170, .28), 0 0 0 1.5px var(--neon), 0 0 36px var(--glow), inset 2px 2px 6px rgba(255, 255, 255, .95), inset -3px -4px 10px rgba(60, 130, 240, .22)
    }

    [data-theme="light"] .links a:hover,
    [data-theme="light"] .links a:focus-visible {
      box-shadow: 0 12px 28px rgba(30, 80, 170, .3), 0 0 0 1.5px var(--neon), 0 0 24px var(--glow), inset 2px 2px 6px rgba(255, 255, 255, .95), inset -3px -4px 10px rgba(60, 130, 240, .22)
    }

    :root {
      --crack: rgba(225, 242, 255, .8)
    }

    :root[data-theme="light"] {
      --crack: rgba(10, 45, 110, .65)
    }

    .gunbtn {
      right: 82px
    }

    .gunbtn[aria-pressed="true"] {
      color: var(--neon);
      box-shadow: 0 0 0 1.5px var(--neon), 0 0 26px var(--glow)
    }

    .armed,
    .armed * {
      cursor: crosshair !important
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60
    }

    #walls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .hole {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none
    }

    .hole svg {
      position: absolute;
      left: -22px;
      top: -22px;
      overflow: visible
    }

    #bazbtn {
      right: 140px
    }

    .scorch {
      position: absolute;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border-radius: 50%;
      background: radial-gradient(rgba(0, 0, 0, .9), rgba(0, 0, 0, .55) 35%, transparent 70%);
      pointer-events: none
    }

    #msg {
      position: fixed;
      left: 0;
      right: 0;
      top: 56%;
      text-align: center;
      font-size: 22px;
      color: var(--muted);
      opacity: 0;
      transition: opacity 1.2s;
      pointer-events: none
    }

    #msg.show {
      opacity: 1
    }

    @media (max-width:520px) {
      .clock {
        padding: 12px 34px 14px;
        border-radius: 32px;
        font-size: 15px;
        top: 84px
      }

      .clock b {
        font-size: 46px
      }

      :root {
        --s: 1
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="4" result="n" />
      <feGaussianBlur in="n" stdDeviation="2" result="nb" />
      <feDisplacementMap id="disp" in="SourceGraphic" in2="nb" scale="24" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>

  <div class="clock glass"><b id="time">--:--</b><span id="date"></span></div>
  <button class="theme glass" id="theme" aria-label="Toggle light and dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <div id="walls"></div>
  <button class="theme gunbtn glass" id="bazbtn" aria-label="Toggle bazooka" aria-pressed="false"><svg
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M3 15l13-7 3 5-13 7z" />
      <path d="M16 8l2-4M19 13l4-1" />
    </svg></button>
  <button class="theme gunbtn glass" id="gunbtn" aria-label="Toggle machine gun" aria-pressed="false"><svg
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="7" />
      <circle cx="12" cy="12" r="1.5" />
      <path d="M12 2v5M12 17v5M2 12h5M17 12h5" />
    </svg></button>
  <main>
    <div class="stage">
      <svg class="gopher" id="gopher" viewBox="0 0 200 260" aria-hidden="true">
        <defs>
          <radialGradient id="fur" cx="40%" cy="20%" r="90%">
            <stop offset="0" stop-color="#8be9ff" />
            <stop offset=".45" stop-color="var(--body)" />
            <stop offset="1" stop-color="var(--body-dark)" />
          </radialGradient>
        </defs>
        <!-- ears -->
        <circle cx="46" cy="40" r="17" fill="url(#fur)" stroke="var(--neon)" stroke-width="2" />
        <circle cx="154" cy="40" r="17" fill="url(#fur)" stroke="var(--neon)" stroke-width="2" />
        <!-- feet -->
        <ellipse cx="72" cy="248" rx="26" ry="11" fill="url(#fur)" stroke="var(--neon)" stroke-width="2" />
        <ellipse cx="128" cy="248" rx="26" ry="11" fill="url(#fur)" stroke="var(--neon)" stroke-width="2" />
        <!-- arms -->
        <ellipse cx="36" cy="165" rx="11" ry="30" transform="rotate(12 36 165)" fill="url(#fur)" stroke="var(--neon)"
          stroke-width="2" />
        <ellipse cx="164" cy="165" rx="11" ry="30" transform="rotate(-12 164 165)" fill="url(#fur)" stroke="var(--neon)"
          stroke-width="2" />
        <!-- head + body -->
        <path
          d="M100 24 C150 24 160 62 162 100 C170 150 168 215 148 240 L52 240 C32 215 30 150 38 100 C40 62 50 24 100 24 Z"
          fill="url(#fur)" stroke="var(--neon)" stroke-width="2.5" />
        <ellipse cx="100" cy="188" rx="40" ry="46" fill="#cdf3ff" opacity=".28" />
        <!-- eyes -->
        <g id="eyeL">
          <circle cx="72" cy="74" r="21" fill="#fff" />
          <circle class="pupil" id="pL" cx="72" cy="74" r="8.5" fill="#06122e" />
          <circle class="pupil" id="hL" cx="69" cy="70" r="2.6" fill="#fff" />
          <circle class="lid" cx="72" cy="74" r="21.5" fill="var(--body)" />
        </g>
        <g id="eyeR">
          <circle cx="128" cy="74" r="21" fill="#fff" />
          <circle class="pupil" id="pR" cx="128" cy="74" r="8.5" fill="#06122e" />
          <circle class="pupil" id="hR" cx="125" cy="70" r="2.6" fill="#fff" />
          <circle class="lid" cx="128" cy="74" r="21.5" fill="var(--body)" />
        </g>
        <!-- muzzle -->
        <ellipse cx="100" cy="106" rx="20" ry="14" fill="#cdf3ff" opacity=".9" />
        <ellipse cx="100" cy="99" rx="7" ry="4.5" fill="#06122e" />
        <path d="M100 104 v6" stroke="#06122e" stroke-width="2" stroke-linecap="round" />
        <path d="M91 112 Q100 119 109 112" fill="none" stroke="#06122e" stroke-width="2" stroke-linecap="round" />
        <rect x="95" y="112" width="4.5" height="7" rx="1.5" fill="#fff" stroke="#06122e" stroke-width="1.2" />
        <rect x="100.5" y="112" width="4.5" height="7" rx="1.5" fill="#fff" stroke="#06122e" stroke-width="1.2" />
        <!-- blush -->
        <ellipse class="blush" cx="48" cy="102" rx="9" ry="5" fill="#7ff0ff" />
        <ellipse class="blush" cx="152" cy="102" rx="9" ry="5" fill="#7ff0ff" />
        <g id="holes"></g>
      </svg>

      <form class="glass" id="f" autocomplete="off">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        <input id="q" type="text" placeholder="Search the web or type a URL" spellcheck="false" autofocus
          aria-label="Search">
        <button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg></button>
      </form>
    </div>

    <nav class="links" id="links"></nav>
  </main>

  <canvas id="fx"></canvas>
  <div id="msg">Everything is wrecked. Reload the page to rebuild it.</div>

  <script>
    /* ---------- EDIT ME ---------- */
    const ENGINE = "https://duckduckgo.com/?q=";   // e.g. https://www.google.com/search?q= , https://search.brave.com/search?q=
    const LINKS = [
      ["GitHub", "https://github.com"],
      ["YouTube", "https://youtube.com"],
      ["Reddit", "https://reddit.com"],
      ["Arch Wiki", "https://wiki.archlinux.org"],
      ["Go Docs", "https://go.dev/doc/"],
      ["Hacker News", "https://news.ycombinator.com"]
    ];
    /* ----------------------------- */

    const $ = id => document.getElementById(id);
    const root = document.documentElement, q = $("q"), gopher = $("gopher");

    // links
    LINKS.forEach(([n, u]) => {const a = document.createElement("a"); a.className = "glass"; a.textContent = n; a.href = u; $("links").appendChild(a)});

    // theme
    function setTheme(t) {root.dataset.theme = t; try {localStorage.setItem("theme", t)} catch (e) { } }
    let saved = null; try {saved = localStorage.getItem("theme")} catch (e) { }
    setTheme(saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
    $("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

    // clock
    function tick() {
      const d = new Date();
      $("time").textContent = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
      $("date").textContent = d.toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"})
    }
    tick(); setInterval(tick, 10000);

    // search
    $("f").addEventListener("submit", e => {
      e.preventDefault();
      const v = q.value.trim(); if (!v) return;
      const isUrl = /^(https?:\/\/|file:\/\/)/i.test(v) || /^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v) && !/\s/.test(v);
      location.href = isUrl ? (/^\w+:\/\//.test(v) ? v : "https://" + v) : ENGINE + encodeURIComponent(v);
    });

    // gopher eyes
    const eyes = [{g: "eyeL", p: ["pL", "hL"]}, {g: "eyeR", p: ["pR", "hR"]}].map(o => ({box: $(o.g).firstElementChild, p: o.p.map($)}));
    const ctx = document.createElement("canvas").getContext("2d");
    let tiltDeg = 0, tiltCur = 0, mouse = {x: innerWidth / 2, y: innerHeight / 2}, lastMove = 0, typing = false, typeTimer;

    addEventListener("pointermove", e => {mouse = {x: e.clientX, y: e.clientY}; lastMove = performance.now(); look()});

    function caretTarget() {
      const r = q.getBoundingClientRect(), cs = getComputedStyle(q);
      ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;

    }
    function look() {

      eyes.forEach(({box, p}) => {
        const r = box.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const dx = t.x - cx, dy = t.y - cy, d = Math.hypot(dx, dy) || 1, m = Math.min(10.5, d / 14);
        const ox = dx / d * m, oy = dy / d * m;
        p.forEach((el, i) => el.style.transform = `translate(${ox * (i ? 1.05 : 1)}px,${oy * (i ? 1.05 : 1)}px)`);
      });
      const gr = gopher.getBoundingClientRect();
      const tilt = Math.max(-4, Math.min(4, (t.x - (gr.left + gr.width / 2)) / 90));
      tiltDeg = tilt;
    }
    ["input", "keyup", "click", "select", "focus", "blur"].forEach(ev => q.addEventListener(ev, () => {
      if (ev === "input" || ev === "keyup") {

        typeTimer = setTimeout(() => {typing = false; gopher.classList.remove("typing"); look()}, 1800)

    }));
    addEventListener("resize", look);

    // liquid wobble: spring physics shared by every glass part and the gopher
    const dark = () => !matchMedia("(prefers-reduced-motion: reduce)").matches; // wobble in every theme
    const mk = (el, g) => ({el, g, o: [0, 0], p: [0, 0, 0, 0, 0], v: [0, 0, 0, 0, 0], t: [0, 0, 0, 0, 0]}); // x,y,scaleX,scaleY,rot
    const bodies = [...document.querySelectorAll(".glass")].map(el => mk(el)), gb = mk(gopher, true), all = [...bodies, gb];
    const formB = bodies.find(b => b.el.id === "f");
    const ctr = el => {const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width}};
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    function kick(b, {x = 0, y = 0, sq = 0, r = 0}) {
      if (!dark()) return;
      b.v[0] += x * 14; b.v[1] += y * 14; b.v[2] += sq * 14; b.v[3] -= sq * 14; b.v[4] += r * 14
    }
    function ripple(src, amp) {
      const c = ctr(src.el);
      all.forEach(b => {
        if (b === src) return; const o = ctr(b.el), dx = o.x - c.x, dy = o.y - c.y, d = Math.hypot(dx, dy) || 1, f = amp / (1 + d / 160);
        kick(b, {x: dx / d * 3 * f, y: dy / d * 3 * f, sq: .025 * f, r: dx / d * .8 * f})
      })
    }
    bodies.forEach(b => {
      const el = b.el;
      el.addEventListener("pointerenter", e => {
        if (!dark()) return; const c = ctr(el);
        kick(b, {x: clamp((e.clientX - c.x) * .02, -4, 4), y: clamp((e.clientY - c.y) * .1, -4, 4), sq: .03});
        b.t[2] = b.t[3] = Math.min(.07, 8 / c.w); ripple(b, .9)
      });
      el.addEventListener("pointermove", e => {
        const r = el.getBoundingClientRect(), c = ctr(el);
        el.style.setProperty("--mx", e.clientX - r.left + "px"); el.style.setProperty("--my", e.clientY - r.top + "px");
        if (!dark() || b.drag) return; b.t[0] = clamp((e.clientX - c.x) * .03, -6, 6); b.t[1] = clamp((e.clientY - c.y) * .12, -3, 3);
        b.t[4] = clamp((e.clientX - c.x) / c.w * 1.6, -1.2, 1.2)
      });
      el.addEventListener("pointerleave", () => {
        b.t = [0, 0, 0, 0, 0]; el.style.removeProperty("--mx"); el.style.removeProperty("--my");
        kick(b, {sq: -.03}); ripple(b, .4)
      });
      el.addEventListener("pointerdown", () => {kick(b, {sq: .09, y: 2}); ripple(b, 1.3)});
      el.addEventListener("pointerup", () => kick(b, {sq: -.1, y: -2}));
    });
    // drag any element anywhere; nothing is saved, so a reload puts everything back
    function attachDrag(b, skip) {
      const el = b.el; el.draggable = false;
      el.addEventListener("pointerdown", e => {
        if (e.button !== 0 || (skip && skip(e))) return;
        const d = b.drag = {sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, on: false}; b.moved = false;
        const move = ev => {
          if (!d.on) {
            if (Math.hypot(ev.clientX - d.sx, ev.clientY - d.sy) < 5) return;
            d.on = b.moved = true; document.body.style.cursor = "grabbing"; d.px = d.sx; d.py = d.sy; b.t[0] = b.t[1] = b.t[4] = 0
          }
          const dx = ev.clientX - d.px, dy = ev.clientY - d.py; d.px = ev.clientX; d.py = ev.clientY;
          b.o[0] += dx; b.o[1] += dy;
          kick(b, {r: clamp(dx * .04, -1.4, 1.4), sq: clamp(Math.hypot(dx, dy) * .0015, 0, .03)});
        };
        const up = () => {
          removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
          document.body.style.cursor = ""; if (d.on) {kick(b, {sq: -.07, r: -.6}); ripple(b, .5)} b.drag = null; setTimeout(() => b.moved = false, 120)
        };
        addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
      });
      el.addEventListener("click", e => {if (b.moved) {e.preventDefault(); e.stopPropagation()} }, true);
    }
    bodies.forEach(b => attachDrag(b, b === formB ? e => !!e.target.closest("#q,.go") : null));
    attachDrag(gb);

    let flip = 1;
    q.addEventListener("input", () => {
      flip = -flip; kick(formB, {sq: .004 * flip, y: flip * .3}); ripple(formB, .2);
      kick(gb, {y: -1.5, sq: -.02})
    });
    q.addEventListener("focus", () => {if (dark()) {formB.t[2] = formB.t[3] = .012; kick(formB, {sq: .012}); ripple(formB, .4)} });
    q.addEventListener("blur", () => {formB.t[2] = formB.t[3] = 0});

    const turb = $("turb"), disp = $("disp"); let last = performance.now(), settled = true;
    (function loop(now) {
      const dt = Math.min(.033, (now - last) / 1000 || .016); last = now; let e = 0;
      tiltCur += (tiltDeg - tiltCur) * .12;
      all.forEach(b => {
        if (b.dead && !b.g) return;
        for (let i = 0; i < 5; i++) {
          const a = 190 * (b.t[i] - b.p[i]) - 9 * b.v[i]; b.v[i] += a * dt; b.p[i] += b.v[i] * dt;
          e += Math.abs(b.v[i]) * (i > 1 ? 1 : .03) + Math.abs(b.p[i] - b.t[i]) * (i > 1 ? 1 : .03)
        }
        const [x, y, sx, sy, r] = b.p;
        b.el.style.transform = `translate(${x + b.o[0]}px,${y + b.o[1]}px) rotate(${(b.g ? tiltCur : 0) + r + (b.spin || 0)}deg) scale(${1 + sx},${1 + sy})`;
      });
      if (dark() && e > .01 && document.activeElement !== q) {
        settled = false; const k = Math.min(e, 2);
        disp.setAttribute("scale", (24 + k * 14).toFixed(1));
        turb.setAttribute("baseFrequency", `${(.009 + .0018 * Math.sin(now / 700)).toFixed(4)} ${(.013 + .002 * Math.cos(now / 900)).toFixed(4)}`);
      } else if (!settled) {settled = true; disp.setAttribute("scale", "24"); turb.setAttribute("baseFrequency", "0.009 0.013")}
      requestAnimationFrame(loop);
    })(last);

    // ---- machine gun: toggle with the crosshair button, hold the mouse to fire. Nothing is saved. ----
    const fx = $("fx"), c = fx.getContext("2d"), walls = $("walls"), btn = $("gunbtn"), bz = $("bazbtn"), dpr = devicePixelRatio || 1;
    let W, H, weapon = null, reload = 0, flashW = 0, armed = false, firing = false, shotT = .07, heat = 0, recoil = 0, flash = 0, ac;
    const sizeFx = () => {W = innerWidth; H = innerHeight; fx.width = W * dpr; fx.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0)};
    sizeFx(); addEventListener("resize", sizeFx);
    bodies.forEach(b => b.hp = b.el.classList.contains("gunbtn") ? 1e9 : Math.round(ctr(b.el).w / 6) + 10); gb.hp = 130;
    const parts = [], rockets = [], rnd = (a = 1) => (Math.random() - .5) * a;
    const spawn = o => parts.push({life: 0, max: 1, g: 0, r: 0, vr: 0, vx: 0, vy: 0, ...o});
    function sfx(d = .06, v = .1) {
      if (!ac) {try {ac = new AudioContext()} catch (e) {return } } if (ac.state === "suspended") ac.resume();
      const n = ac.sampleRate * d | 0, buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++)ch[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = buf; f.type = "lowpass"; f.frequency.value = 1800; g.gain.value = v; s.connect(f); f.connect(g); g.connect(ac.destination); s.start()
    }
    const holeG = () => {
      let l = ""; for (let i = 0, n = 3 + Math.random() * 4 | 0; i < n; i++) {const a = Math.random() * 6.28, r = 8 + Math.random() * 13; l += `<path d="M0 0L${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r).toFixed(1)}"/>`}
      return `<g style="stroke:var(--crack);stroke-width:1;fill:none">${l}<circle r="3.2" style="fill:#000;stroke:var(--crack)"/></g>`
    };
    const bodyAt = (x, y) => {const el = document.elementFromPoint(x, y); return el && all.find(b => !b.dead && b.el.contains(el))};
    function mark(b, x, y) {
      if (b && b.g) {
        const p = gopher.createSVGPoint(), m = gopher.getScreenCTM(); if (!m) return; p.x = x; p.y = y; const l = p.matrixTransform(m.inverse());
        $("holes").insertAdjacentHTML("beforeend", `<g transform="translate(${l.x} ${l.y}) scale(.6)">${holeG()}</g>`)
      }
      else {
        const host = b ? b.el : walls, r = host.getBoundingClientRect();
        host.insertAdjacentHTML("beforeend", `<i class="hole" style="left:${x - r.left}px;top:${y - r.top}px"><svg width="44" height="44" viewBox="-22 -22 44 44">${holeG()}</svg></i>`)
      }
    }
    function die(b) {
      const r = b.el.getBoundingClientRect(); b.dead = true; sfx(.35, .22);
      if (b.g) {
        b.fv = [rnd(300), -520, rnd(700)];
        for (let i = 0; i < 20; i++)spawn({k: "sp", x: r.left + r.width / 2, y: r.top + r.height / 2, vx: rnd(500), vy: rnd(500), max: .5, col: "#7ff0ff"})
      }
      else {
        b.el.style.visibility = "hidden"; b.el.style.pointerEvents = "none";
        const lt = root.dataset.theme === "light";
        for (let i = 0, n = Math.min(60, r.width * r.height / 500 + 14); i < n; i++) {
          const x = r.left + Math.random() * r.width, y = r.top + Math.random() * r.height;
          spawn({k: "sh", x, y, vx: (x - r.left - r.width / 2) * 2 + rnd(120), vy: rnd(300) - 120, g: 1500, r: Math.random() * 6, vr: rnd(14), sz: 5 + Math.random() * 12, max: 1 + Math.random() * .8, col: lt ? "rgba(255,255,255,.85)" : "rgba(120,190,255,.65)"})
        }
      }
      if (bodies.every(x => x.dead || x.el.classList.contains("gunbtn"))) $("msg").classList.add("show");
    }
    function shoot(a, gx, gy) {
      const sp = 6 + heat * 28, tx = mouse.x + rnd(sp * 2), ty = mouse.y + rnd(sp * 2), L = 100 - recoil;
      heat = Math.min(1, heat + .06); recoil = 12; flash = .05; sfx();
      spawn({k: "t", x: gx + Math.cos(a) * L, y: gy + Math.sin(a) * L, x1: tx, y1: ty, max: .07});
      spawn({k: "c", x: gx, y: gy - 14, vx: rnd(300), vy: -250 - Math.random() * 150, g: 1600, vr: rnd(30), max: .9});
      for (let i = 0; i < 3; i++)spawn({k: "sp", x: tx, y: ty, vx: rnd(420), vy: rnd(420), max: .25 + Math.random() * .2, col: "#ffd36b"});
      const b = bodyAt(tx, ty); mark(b, tx, ty);
      if (b) {b.hp--; kick(b, {x: rnd(3), y: rnd(3), sq: .02, r: rnd(1.2)}); if (b.hp <= 0) die(b)}
    }
    const setW = w => {weapon = w; armed = !!w; firing = false; root.classList.toggle("armed", armed); btn.setAttribute("aria-pressed", w === "gun"); bz.setAttribute("aria-pressed", w === "baz")};
    btn.addEventListener("click", () => {if (!btn.moved) setW(weapon === "gun" ? null : "gun")});
    bz.addEventListener("click", () => {if (!bz.moved) setW(weapon === "baz" ? null : "baz")});
    addEventListener("keydown", e => {if (e.key === "Escape") setW(null)});
    addEventListener("pointerdown", e => {if (!armed || e.button !== 0 || e.target.closest(".gunbtn")) return; e.preventDefault(); e.stopPropagation(); firing = true; sfx(.01, .01)}, true);
    ["pointerup", "pointercancel", "blur"].forEach(n => addEventListener(n, () => firing = false, true));
    addEventListener("click", e => {if (armed && !e.target.closest(".gunbtn")) {e.preventDefault(); e.stopPropagation()} }, true);

    function explode(x, y) {
      const R = 160; sfx(.5, .4); flashW = .35;
      for (let i = 0; i < 34; i++)spawn({k: "fb", x: x + rnd(40), y: y + rnd(40), vx: rnd(380), vy: rnd(380) - 60, max: .5 + Math.random() * .5, sz: 14 + Math.random() * 26});
      for (let i = 0; i < 30; i++)spawn({k: "sp", x, y, vx: rnd(1100), vy: rnd(1100), max: .4 + Math.random() * .4, col: "#ffd36b"});
      for (let i = 0; i < 10; i++)spawn({k: "sm", x: x + rnd(60), y: y + rnd(60), vx: rnd(120), vy: -40 - Math.random() * 80, max: 1.4, sz: 22});
      spawn({k: "ring", x, y, R: R * 1.3, max: .45});
      walls.insertAdjacentHTML("beforeend", `<i class="scorch" style="left:${x}px;top:${y}px"></i>`);
      all.forEach(b => {
        if (b.dead) return; const r = b.el.getBoundingClientRect(), nx = clamp(x, r.left, r.right), ny = clamp(y, r.top, r.bottom), d = Math.hypot(nx - x, ny - y);
        if (d >= R) return; const f = 1 - d / R, cx = r.left + r.width / 2 - x, cy = r.top + r.height / 2 - y, cd = Math.hypot(cx, cy) || 1;
        mark(b, nx, ny); kick(b, {x: cx / cd * 18 * f, y: cy / cd * 18 * f, sq: .1 * f, r: rnd(6) * f});
        b.hp -= Math.ceil(75 * f); if (b.hp <= 0) die(b)
      });
      for (let i = 0; i < 4; i++)mark(null, x + rnd(R * .8), y + rnd(R * .8));
    }
    function launch(a, gx, gy) {
      const L = 100 - recoil, sx = gx + Math.cos(a) * L, sy = gy + Math.sin(a) * L;
      rockets.push({x: sx, y: sy, a: Math.atan2(mouse.y - sy, mouse.x - sx), t: 0}); recoil = 30; flash = .09; sfx(.3, .3);
      for (let i = 0; i < 10; i++)spawn({k: "sm", x: gx, y: gy, vx: -Math.cos(a) * (80 + Math.random() * 200) + rnd(120), vy: -Math.sin(a) * (80 + Math.random() * 200) + rnd(120), max: .8, sz: 12})
    }

    let t0 = performance.now();
    (function frame(now) {
      const dt = Math.min(.033, (now - t0) / 1000 || .016); t0 = now;
      c.clearRect(0, 0, W, H);
      const gx = clamp(mouse.x, 100, W - 100), gy = H - 14, a = clamp(Math.atan2(mouse.y - gy, mouse.x - gx), -3, -.14);
      heat = Math.max(0, heat - dt * .8); recoil = Math.max(0, recoil - dt * 160); flash -= dt;
      reload = Math.max(0, reload - dt);
      if (armed && firing) {if (weapon === "gun") {shotT += dt; while (shotT > .07) {shotT -= .07; shoot(a, gx, gy)} } else if (reload <= 0) {launch(a, gx, gy); reload = .9} } else shotT = .07;
      if (flashW > 0) {c.fillStyle = `rgba(255,235,190,${flashW})`; c.fillRect(0, 0, W, H); flashW -= dt * 1.2}
      if (gb.dead && gb.fv) {
        gb.fv[1] += 1800 * dt; gb.o[0] += gb.fv[0] * dt; gb.o[1] += gb.fv[1] * dt; gb.spin = (gb.spin || 0) + gb.fv[2] * dt;
        if (gb.o[1] > H + 700) {gb.fv = null; gopher.style.display = "none"}
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.life += dt; if (p.life > p.max) {parts.splice(i, 1); continue}
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; c.globalAlpha = 1 - p.life / p.max;
        if (p.k === "t") {c.strokeStyle = "#ffe9a8"; c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x1, p.y1); c.stroke()}
        else if (p.k === "sp") {c.strokeStyle = p.col; c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); c.stroke()}
        else if (p.k === "fb") {const t = p.life / p.max; c.fillStyle = `rgb(255,${190 - 140 * t | 0},${60 - 50 * t | 0})`; c.beginPath(); c.arc(p.x, p.y, p.sz * (.4 + t * .9), 0, 7); c.fill()}
        else if (p.k === "sm") {c.fillStyle = "rgba(150,160,175,.5)"; c.beginPath(); c.arc(p.x, p.y, p.sz * (.5 + p.life / p.max), 0, 7); c.fill()}
        else if (p.k === "ring") {c.strokeStyle = "rgba(255,220,160,.9)"; c.lineWidth = 5 * (1 - p.life / p.max) + 1; c.beginPath(); c.arc(p.x, p.y, p.R * (p.life / p.max), 0, 7); c.stroke()}
        else {
          c.save(); c.translate(p.x, p.y); c.rotate(p.r);
          if (p.k === "c") {c.fillStyle = "#e8b94a"; c.fillRect(-3, -1.5, 6, 3)}
          else {c.fillStyle = p.col; c.strokeStyle = "rgba(190,235,255,.9)"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -p.sz); c.lineTo(p.sz * .7, p.sz * .6); c.lineTo(-p.sz * .5, p.sz * .4); c.closePath(); c.fill(); c.stroke()}
          c.restore()
        }
      }
      c.globalAlpha = 1;
      for (let i = rockets.length - 1; i >= 0; i--) {
        const k = rockets[i]; k.t += dt;
        let d = Math.atan2(mouse.y - k.y, mouse.x - k.x) - k.a; d = Math.atan2(Math.sin(d), Math.cos(d)); k.a += clamp(d, -4 * dt, 4 * dt);
        k.x += Math.cos(k.a) * 900 * dt; k.y += Math.sin(k.a) * 900 * dt;
        spawn({k: "sm", x: k.x, y: k.y, vx: rnd(30), vy: rnd(30), max: .6, sz: 5});
        spawn({k: "sp", x: k.x, y: k.y, vx: -Math.cos(k.a) * 200 + rnd(100), vy: -Math.sin(k.a) * 200 + rnd(100), max: .2, col: "#ffb347"});
        if (Math.hypot(mouse.x - k.x, mouse.y - k.y) < 24 || bodyAt(k.x, k.y) || k.t > 3 || k.x < -60 || k.x > W + 60 || k.y < -60 || k.y > H + 60) {rockets.splice(i, 1); explode(k.x, k.y); continue}
        c.save(); c.translate(k.x, k.y); c.rotate(k.a); c.shadowColor = "#ffb347"; c.shadowBlur = 14;
        c.fillStyle = "#ffb347"; c.beginPath(); c.moveTo(-12, -4); c.lineTo(-26 - Math.random() * 8, 0); c.lineTo(-12, 4); c.fill();
        c.shadowColor = "#27d3ff"; c.fillStyle = "#d8f1ff"; c.fillRect(-12, -4, 22, 8);
        c.fillStyle = "#ff5a5a"; c.beginPath(); c.moveTo(10, -4); c.lineTo(18, 0); c.lineTo(10, 4); c.fill();
        c.fillStyle = "#27d3ff"; c.fillRect(-12, -8, 6, 4); c.fillRect(-12, 4, 6, 4); c.restore()
      }
      if (armed) {
        c.save(); c.translate(gx - Math.cos(a) * recoil * .5, gy - Math.sin(a) * recoil * .5); c.rotate(a);
        c.shadowColor = "#27d3ff"; c.shadowBlur = 14; c.fillStyle = "#08162e"; c.strokeStyle = "#27d3ff"; c.lineWidth = 2;
        (weapon === "baz" ? [[-70, -13, 170, 26], [96, -17, 10, 34], [-30, 13, 16, 30], [8, -22, 22, 9], [-70, -9, 8, 18]] : [[-46, -15, 86, 30], [40, -5, 62, 10], [-8, 13, 18, 34], [-44, 10, 15, 30], [60, -11, 10, 7]]).forEach(r => {c.fillRect(...r); c.strokeRect(...r)});
        c.restore();
        if (flash > 0) {
          const fx_ = gx + Math.cos(a) * 102, fy_ = gy + Math.sin(a) * 102, g = c.createRadialGradient(fx_, fy_, 0, fx_, fy_, 34);
          g.addColorStop(0, "rgba(255,250,200,1)"); g.addColorStop(.4, "rgba(255,170,60,.6)"); g.addColorStop(1, "rgba(255,120,0,0)");
          c.fillStyle = g; c.beginPath(); c.arc(fx_, fy_, 34, 0, 7); c.fill()
        }
      }
      requestAnimationFrame(frame);
    })(t0);

    // blink
    (function blink() {
      gopher.classList.add("blink"); setTimeout(() => gopher.classList.remove("blink"), 130);
      setTimeout(blink, 2200 + Math.random() * 3200)
    })();
    look();
  </script>
